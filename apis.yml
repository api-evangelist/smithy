apis:
  - aid: smithy:smithy-idl
    name: Smithy IDL
    description: >-
      The Smithy Interface Definition Language (IDL) is a specification for
      defining API models using shapes and traits. Models can be written in the
      Smithy IDL syntax or the JSON AST representation. Smithy 2.0 is the current
      stable version with improved nullability, enums, resource properties, and mixins.
    humanURL: https://smithy.io/2.0/
    tags:
      - IDL
      - API Design
      - Specification
    properties:
      - type: Documentation
        url: https://smithy.io/2.0/
      - type: Specification
        url: https://smithy.io/2.0/spec/
      - type: GettingStarted
        url: https://smithy.io/2.0/quickstart.html
      - type: GitHubRepository
        url: https://github.com/smithy-lang/smithy

  - aid: smithy:smithy-cli
    name: Smithy CLI
    description: >-
      The Smithy CLI is a command-line tool for building, validating, diffing,
      and transforming Smithy models. It can generate JSON AST representations,
      run model validation, perform backwards-compatibility checks, and generate
      artifacts from Smithy models.
    humanURL: https://smithy.io/2.0/guides/smithy-cli/index.html
    tags:
      - CLI
      - Build Tools
      - Validation
