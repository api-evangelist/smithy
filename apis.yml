aid: smithy
name: Smithy
description: >-
  Smithy is an open source, protocol-agnostic interface definition language (IDL)
  and toolchain developed at AWS for defining, validating, and generating API clients,
  servers, and documentation for any programming language. It powers the AWS SDK
  code generation pipeline and supports protocol-agnostic API modeling with traits,
  validators, and code generators. Smithy IDL 2.0 is the current stable version.
