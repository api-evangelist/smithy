aid: smithy
name: Smithy
description: >-
  Smithy is an open source interface definition language and toolchain from AWS
  for defining, validating, and generating API clients and services. It powers
  the AWS SDK code generation pipeline and supports building protocol-agnostic
  API models with traits, validators, and code generators.
